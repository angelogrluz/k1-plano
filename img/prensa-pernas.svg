<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 230" width="400" height="230" role="img">
<title>Prensa de pernas a 45 graus</title>
<rect width="400" height="230" fill="#f8fafc"/>
<defs>
  <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0 0 L10 5 L0 10 Z" fill="#2563eb"/>
  </marker>
</defs>
<line x1="16" y1="208" x2="384" y2="208" stroke="#e2e8f0" stroke-width="3"/>

<g stroke="#64748b" stroke-width="8" fill="none" stroke-linecap="round">
  <path d="M96 198 L340 36"/>
  <path d="M64 198 L308 36"/>
</g>
